name: Enhancement
description: Propose a new capability or an improvement to an existing one
labels: [enhancement, triage]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What can you not do today? Describe the situation, not the solution.
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposed approach
      description: What you have in mind, and any alternatives you considered.
    validations:
      required: true

  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Design tokens / theming
        - Geometry components (frame, elbow, button, panel)
        - Telemetry components (readout, bargraph, status pill)
        - Keypad and input
        - Procedural audio
        - Packaging and distribution
        - Documentation
        - Other
    validations:
      required: true

  - type: checkboxes
    id: breaking
    attributes:
      label: Compatibility
      options:
        - label: This would change existing public API (attributes, events, or CSS custom properties)
