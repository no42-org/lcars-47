#
# Blocks a pull request that introduces a dependency with a known vulnerability
# or an incompatible licence, before it reaches main.
name: Dependency review

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: dependency-review-${{ github.ref }}
  cancel-in-progress: true

jobs:
  review:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: write # post the summary comment
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: moderate
          comment-summary-in-pr: on-failure
          # This library is LGPL-3.0-or-later. Copyleft-incompatible or
          # ambiguous licences in the dependency tree are a licensing problem,
          # not a style preference.
          deny-licenses: AGPL-3.0, AGPL-3.0-only, AGPL-3.0-or-later
