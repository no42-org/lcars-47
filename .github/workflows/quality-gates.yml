#
# Defined once and called by CI (and later by release/preview) as a reusable
# workflow, so a release can never publish through a gate that PRs enforce.
name: Quality gates

on:
  workflow_call:

permissions:
  contents: read

jobs:
  verify:
    # typecheck, test and build share one node_modules install; splitting them
    # into separate jobs would triple the install cost for no added signal.
    name: Typecheck, test and build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: make install

      # The layout gate drives a real browser; happy-dom cannot see geometry.
      - run: make install-browsers

      - run: make verify

  workflows:
    # Lints the workflows themselves: unpinned actions, script injection, bad
    # expressions, invalid schema. Cheap, and catches the mistakes that are
    # otherwise only found in production.
    name: Lint workflows
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # docker:// refs pin by image digest, not commit SHA.
      - uses: docker://rhysd/actionlint@sha256:b1934ee5f1c509618f2508e6eb47ee0d3520686341fec936f3b79331f9315667 # v1.7.12
        with:
          args: -color

      - uses: zizmorcore/zizmor-action@3dc1ecc9bcb9e94e9b2c709687979e1298497054 # v0.6.2
        with:
          # SARIF upload needs GitHub Advanced Security, which a private repo on
          # this plan does not have; leaving it on fails the job with
          # "Resource not accessible by integration" regardless of findings.
          # Re-enable if this repo goes public or gains GHAS.
          advanced-security: false
          # Without the SARIF upload, annotations are how findings surface.
          annotations: true
          # Pin the tool as well as the action: `latest` would silently change
          # what this gate enforces.
          version: 1.29.0
