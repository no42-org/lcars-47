#
# Triggered only by version tags. This is a browser component library with no
# container image, so the released artifacts are the npm tarball and the
# standalone CDN bundles rather than a GHCR push.
name: Release

on:
  push:
    tags: ['v*.*.*']

permissions:
  contents: read

# Serialize releases and never cancel one: a half-cancelled release can leave a
# draft with partial assets or artifacts with no signature.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  gates:
    uses: ./.github/workflows/quality-gates.yml

  release:
    needs: gates
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: write # create the release and upload assets
      id-token: write # cosign keyless signing and npm trusted publishing (OIDC)
      attestations: write # SLSA build provenance
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Caching is disabled here, unlike CI. The Actions cache is writable from
      # lower-privileged contexts such as pull-request builds, so restoring it
      # in the job that signs and publishes artifacts is a cache poisoning path
      # into a release. npm ci is deterministic from the lockfile; the only cost
      # is a slower install.
      #
      # package-manager-cache: false is required, not just omitting `cache:` —
      # setup-node v7 caches by default whenever a lockfile is present.
      # No registry-url here on purpose: publishing uses npm trusted publishing
      # (OIDC via id-token: write), and setup-node's registry-url writes an
      # .npmrc referencing NODE_AUTH_TOKEN, which npm errors on when the
      # variable is unset. The registry comes from publishConfig in
      # package.json.
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          package-manager-cache: false

      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Fail if the tag does not match the manifest version
        env:
          TAG: ${{ github.ref_name }}
        run: |
          # A v0.4.0 tag on a tree whose package.json says 0.3.0 ships a
          # bundle that self-reports the wrong version.
          manifest="v$(node -p 'require("./package.json").version')"
          if [ "$manifest" != "$TAG" ]; then
            echo "tag $TAG does not match package.json ($manifest)" >&2
            exit 1
          fi

      - run: make install

      # release-build re-runs the full gate, which now includes the browser
      # layout checks. Without this the release aborts after the PR gates have
      # already passed.
      - run: make install-browsers

      - run: make release-build

      # The SBOM itself comes out of make release-build (npm sbom, first-party).
      # This renders it as a self-contained HTML report. Both must exist before
      # checksums are computed, or they ship unverifiable.
      #
      # image is pinned to a digest deliberately: the action's own resolution
      # falls back to the mutable report-rc tag, and this job signs what it
      # produces, so it must not pull a moving image. Dependabot bumps the
      # action pin but not this digest; update it when bumping the action.
      - name: Render SBOM report
        uses: no42-org/blitsbom@b3cb2b1bdd5664193478acf04812251fdc8eb124 # v0.7.1
        with:
          sbom: release/sbom.cdx.json
          output: release/sbom-report.html
          image: ghcr.io/no42-org/blitsbom@sha256:72ac31712ac30279ed4b297fbf6453182288862c678e8c77c83e70fb2ffb30b5

      - name: Checksums and signature
        run: |
          cd release
          # Write to a temp file and move it into place: redirecting straight to
          # checksums.txt would create the target before find reads the
          # directory, making the file's own presence depend on ordering.
          # -print0/-0 keeps this correct for any filename.
          tmp="$(mktemp)"
          find . -type f -print0 | sort -z | xargs -0 sha256sum > "$tmp"
          mv "$tmp" checksums.txt
          # cosign v3 emits a Sigstore bundle carrying both the signature and
          # the certificate. Passing only --output-signature/--output-certificate
          # leaves the bundle path empty and fails with
          # "create bundle file: open : no such file or directory".
          cosign sign-blob --yes \
            --bundle checksums.txt.bundle \
            checksums.txt

      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: release/*.tgz

      - name: Create draft release and upload assets
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          # Prerelease tags (v1.2.3-rc1) are marked as such.
          case "$TAG" in *-*) PRE=--prerelease ;; *) PRE= ;; esac
          gh release view "$TAG" >/dev/null 2>&1 || \
            gh release create "$TAG" --draft --verify-tag \
              --title "$TAG" --notes "Release notes pending." $PRE
          find release -type f -exec gh release upload "$TAG" --clobber {} +

      # Last, because publishing is the one irreversible step here: a version
      # cannot be re-published once taken. Everything else has been verified by
      # the time this runs.
      #
      # Publishes the exact tarball that was checksummed, signed and attested,
      # rather than repacking, so the artifact users install is the one the
      # signature covers.
      #
      # Auth is npm trusted publishing: the repo/workflow pair is registered as
      # a trusted publisher on npmjs.com, npm exchanges the OIDC token itself,
      # and provenance is generated automatically. No NODE_AUTH_TOKEN.
      - name: Publish to npm
        env:
          TAG: ${{ github.ref_name }}
        run: |
          # ./ prefix is required: npm reads a bare "release/x.tgz" as a git
          # shorthand (owner/repo) and tries to clone it.
          tarball="$(find ./release -name '*.tgz' -type f)"
          case "$TAG" in
            *-*) npm publish "$tarball" --tag next ;;
            *)   npm publish "$tarball" ;;
          esac
