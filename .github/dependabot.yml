version: 2
updates:
  # Required: this is what rewrites the SHA pins in .github/workflows AND their
  # version comments. Without it, pinning rots into permanently stale actions.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    # Supply-chain cooldown: do not propose a version the moment it is
    # published. A compromised release is typically yanked within days, and
    # this window means the repo never auto-adopts one.
    cooldown:
      default-days: 7
      semver-major-days: 30
      semver-minor-days: 7
      semver-patch-days: 3
    open-pull-requests-limit: 5
    commit-message:
      prefix: chore
      include: scope
    groups:
      actions:
        patterns: ['*']

  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    # Supply-chain cooldown: do not propose a version the moment it is
    # published. A compromised release is typically yanked within days, and
    # this window means the repo never auto-adopts one.
    cooldown:
      default-days: 7
      semver-major-days: 30
      semver-minor-days: 7
      semver-patch-days: 3
    open-pull-requests-limit: 5
    commit-message:
      prefix: chore
      prefix-development: chore
      include: scope
    groups:
      # One reviewable PR for the safe bumps; majors still arrive individually
      # so a breaking change is never buried in a group.
      minor-and-patch:
        update-types: [minor, patch]
    ignore:
      # lit is the one runtime dependency and is externalized from the ESM
      # bundle, so a major bump is a consumer-visible peer change. Handle it
      # deliberately rather than as a routine PR.
      - dependency-name: lit
        update-types: [version-update:semver-major]
      # TypeScript 7 dropped the JavaScript Compiler API that declaration
      # bundling depends on, and API Extractor cannot resolve DOM lib symbols
      # without it. Adopting 7.x today would cost the single bundled
      # dist/index.d.ts that RELEASING.md advertises. See issue #6.
      - dependency-name: typescript
        update-types: [version-update:semver-major]
